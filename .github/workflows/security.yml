# Security scanning pipeline
#
# Runs on every push to main and every PR targeting it.
# This is separate from ci.yml (which handles build + type-check + migrations)
# so that security failures are clearly visible as their own check.
#
# Two parallel jobs:
#   1. security-checks — fast scans that don't need a Docker build
#   2. image-scan — builds the Docker image, scans it for CVEs and boots it

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Fast security scans ─────────────────────────────────────────────
  security-checks:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of a PR

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed for Gitleaks to scan all commits
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Secret scanning ────────────────────────────────────────────────────
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # would need pull-requests: write; the failed check is enough

      # ── Dependency audit ────────────────────────────────────────────────────
      # Audits devDependencies too: svelte, @sveltejs/kit and devalue are
      # listed as devDependencies but are bundled into the server build, so
      # --omit=dev would hide vulnerabilities that ship to production.
      - name: npm audit
        run: npm audit --audit-level=high

      # The ESLint security rules (eslint-plugin-security, no-unsanitized) are
      # part of the shared ESLint config, so `npm run lint` in the CI workflow
      # already enforces them; running ESLint again here would only repeat it.

      # ── License compliance ──────────────────────────────────────────────────
      # `sentry` (the Sentry CLI, pulled in by @sentry/sveltekit's build plugin)
      # is FSL-1.1-Apache-2.0: source-available, each release turning Apache-2.0
      # after two years. It only runs at build time to upload source maps and is
      # never part of the app, so it is excluded by name at whatever version is
      # installed.
      # The allowed licences are in the `license` script in package.json, which
      # the pre-push hook runs too.
      - name: License compliance check
        run: npm run license

      # ── Semgrep SAST ────────────────────────────────────────────────────────
      # Runs the official Semgrep container (the old returntocorp/semgrep-action
      # is deprecated). Pinned by digest; bump the tag + digest together.
      - name: Semgrep SAST
        run: >-
          docker run --rm -v "${{ github.workspace }}:/src" -w /src
          semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --config p/javascript --config p/typescript --error --metrics=off

      # ── Trivy config scan (Dockerfiles, docker-compose) ─────────────────────
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # ── Job 2: Docker image scan ────────────────────────────────────────────────
  # Runs in parallel with security-checks. Builds the app image and scans it.
  image-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A database for the boot test below.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chessstack
          POSTGRES_PASSWORD: chessstack
          POSTGRES_DB: chessstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chessstack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        id: build
        run: docker build -t chessstack:ci-scan .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'chessstack:ci-scan'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      # Start the image the way Railway does and check it comes up: migrations
      # run on an empty database, Docker's own HEALTHCHECK turns healthy, and
      # the pages, the readiness check and the engine files answer. The seed
      # restore is skipped (SEED_DATA_DIR points at nothing): it takes several
      # minutes and gigabytes of disk.
      # Runs even when the Trivy scan fails, so both results show.
      - name: Boot test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgresql://chessstack:chessstack@localhost:5432/chessstack \
            -e ORIGIN=http://localhost:3000 \
            -e SEED_DATA_DIR=/nonexistent \
            chessstack:ci-scan

          # The HEALTHCHECK polls every 30 s, so allow a few rounds.
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app 2>/dev/null || echo gone)
            [ "$status" = healthy ] && break
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != true ]; then
              echo "::error::The container exited during startup."
              exit 1
            fi
            sleep 5
          done
          if [ "$status" != healthy ]; then
            echo "::error::The container did not become healthy (status: $status)."
            exit 1
          fi

          [ "$(docker exec app id -u)" = 1000 ] || { echo "::error::The app is not running as the node user."; exit 1; }

          curl -fsS http://localhost:3000/api/health/ready
          echo
          # / redirects to the sign-in page on a fresh instance; follow it so a page renders.
          curl -fsSL -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null -w '%{content_type}\n' http://localhost:3000/engine/stockfish-19-lite.js | grep -q '^text/javascript'
          curl -fsS -o /dev/null -w '%{content_type}\n' http://localhost:3000/engine/stockfish-19-lite-single.wasm | grep -q '^application/wasm'
          echo "The image booted, migrated an empty database and served its pages."

      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -n 200 || true
