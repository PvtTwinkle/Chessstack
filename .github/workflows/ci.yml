# GitHub Actions CI workflow
#
# This file tells GitHub to run automated checks on every push to main
# and every pull request that targets it. If any step fails, GitHub marks the
# commit or PR as broken — so a red X is visible before anyone merges bad code.
#
# GitHub reads any .yml files in .github/workflows/ automatically. No other
# configuration is needed to activate this.

name: CI

on:
  # Run when code is pushed to main
  push:
    branches: [main]
  # Run when a pull request is opened or updated against main
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Type Check, Tests & Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL service container for the migration smoke test.
    # GitHub Actions spins this up before the job steps run and tears it down
    # after the job finishes. The database is empty — migrations create all tables.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chessstack
          POSTGRES_PASSWORD: chessstack
          POSTGRES_DB: chessstack
        ports:
          - 5432:5432
        # Wait until PostgreSQL is accepting connections before running steps.
        options: >-
          --health-cmd "pg_isready -U chessstack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Check out the repository code onto the GitHub-hosted machine.
      # Without this step, the machine has no code to work with.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 2: Install the correct version of Node.js.
      # Node 24 (LTS) matches the Docker runtime image and @types/node in package.json.
      # cache: 'npm' tells GitHub to save the npm cache between runs so that
      # repeated CI runs don't have to re-download every package from scratch.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # Step 3: Install all dependencies exactly as specified in package-lock.json.
      # `npm ci` is the CI-safe version of `npm install` — it never modifies
      # package-lock.json and fails loudly if anything is out of sync.
      # This also runs the `prepare` script (svelte-kit sync) automatically.
      - name: Install dependencies
        run: npm ci

      # Step 4: TypeScript and Svelte type checking.
      # Runs `svelte-kit sync && svelte-check` — this checks that all TypeScript
      # types are correct across the entire project, including inside .svelte files.
      # Catches type errors that the build step alone might not surface. It also
      # type-checks the Playwright specs in e2e/ (e2e/tsconfig.json).
      - name: Type check
        run: npm run check

      # ESLint's cache (see the lint script) skips files whose content hasn't
      # changed since the last run, which saves most of its run time. It is
      # restored after `npm ci`, which empties node_modules. The key moves with
      # every commit so the cache is saved each run; a new lockfile or config
      # starts it from scratch.
      - name: Cache ESLint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-

      # Step 5: Formatting and lint.
      # `npm run lint` runs `prettier --check` and ESLint, so a file that was
      # never run through `npm run format` fails here.
      - name: Format and lint
        run: npm run lint

      # Schema drift check. The latest snapshot in drizzle/migrations/meta must
      # describe schema.ts exactly, or `drizzle-kit generate` writes a bogus
      # migration the next time someone changes the schema. Any file it
      # creates here means schema.ts changed without a matching migration.
      - name: Schema matches migrations
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "::error::schema.ts does not match drizzle/migrations. Run npx drizzle-kit generate and commit the result."
            exit 1
          fi

      # Step 6: Production build.
      # Runs `vite build` with the adapter-node adapter to produce a self-contained
      # Node.js server in the build/ directory. If any import fails, a component
      # is malformed, or a SvelteKit API route has a problem, this step fails.
      - name: Build
        run: npm run build

      # Step 7: Migration smoke test.
      # Runs our custom script that applies every migration file in drizzle/migrations/
      # against the PostgreSQL service container. If any SQL file has a syntax error,
      # a missing table reference, or a constraint problem, this step fails.
      - name: Smoke test migrations
        run: node scripts/test-migrations.mjs
        env:
          DATABASE_URL: postgresql://chessstack:chessstack@localhost:5432/chessstack

      # Step 8: Unit and database tests, in one run so coverage counts both.
      # Unit tests are pure logic (FSRS scheduling, PGN parsing, Stripe status
      # mapping, trainer ratings…). Database tests run against the service
      # container (migrations applied automatically, tables truncated between
      # tests): rate limiting, single-use tokens, repertoire locking, referrals,
      # checkout and the Stripe webhook (Stripe API mocked). Coverage must stay
      # at or above the floor set in the test:ci script; raise the floor as
      # tests are added, never lower it to get a change through.
      - name: Unit and database tests
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://chessstack:chessstack@localhost:5432/chessstack

      - name: Coverage summary
        if: always() && hashFiles('coverage/summary.txt') != ''
        run: |
          {
            echo '### Test coverage (unit and database tests)'
            echo '```'
            cat coverage/summary.txt
            echo '```'
            echo '<details><summary>Per file</summary>'
            echo
            echo '```'
            cat coverage/files.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage/index.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # The end-to-end tests only need a production build, so they run as their
  # own jobs, alongside the type check and unit tests above rather than after
  # them. Each edition gets its own runner and database, so the two suites run
  # side by side and a failure in one doesn't stop the other. The cloud leg
  # keeps the original check name, "End-to-end tests".
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # The critical path (register → build a line → drill it), drill,
          # review, puzzle and trainer modes, account and settings flows,
          # admin, the opening guides and the public pages' SEO.
          - name: End-to-end tests
            edition: cloud
          # A self-hosted instance: its first run creates the default admin.
          - name: End-to-end tests (self-hosted)
            edition: selfhosted

    # The e2e server applies migrations to this empty database on startup.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chessstack
          POSTGRES_PASSWORD: chessstack
          POSTGRES_DB: chessstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chessstack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Cache the downloaded Chromium, keyed on the Playwright version, so most
      # runs only install the system libraries it needs.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Starts the production build and drives it in headless Chromium.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          EDITION: ${{ matrix.edition }}
          # Fail on serious or critical accessibility violations.
          AXE_ENFORCE: '1'
          DATABASE_URL: postgresql://chessstack:chessstack@localhost:5432/chessstack

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.edition }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
