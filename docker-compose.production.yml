# Chessstack — Docker Compose for a long-running install.
#
# Reads its secrets from a .env file next to this one (see .env.example) and
# refuses to start without them, so no instance runs on a published password:
#
#   POSTGRES_PASSWORD=<a long random string>
#   DEFAULT_PASSWORD=<the first admin's password>
#   ORIGIN=https://chess.yourdomain.com
#
# Then: docker compose -f docker-compose.production.yml up -d

services:
  app:
    image: ghcr.io/pvttwinkle/chessstack:latest
    container_name: chessstack-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://chessstack:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/chessstack
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - DEFAULT_USERNAME=${DEFAULT_USERNAME:-admin}
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:?set DEFAULT_PASSWORD in .env}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite} # 'open' lets anyone register an account
      - GAME_IMPORT_INTERVAL_MINUTES=${GAME_IMPORT_INTERVAL_MINUTES:-0} # How often the app fetches new games from Lichess & Chess.com.
      # Behind a reverse proxy, the header carrying the visitor's IP (see .env.example).
      - ADDRESS_HEADER=${ADDRESS_HEADER:-}
      - XFF_DEPTH=${XFF_DEPTH:-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
  postgres:
    image: postgres:17-alpine
    container_name: chessstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chessstack
      POSTGRES_USER: chessstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chessstack']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
